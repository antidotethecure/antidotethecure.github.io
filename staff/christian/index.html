<!-- Staff training app for Melody Bar & Grill + Nalu Vida (English / Español). It holds NO customer data and never
     fetches any: only the public reward values (demo/christian-live.js) and the employee's own practice points + quiz,
     which stay on this phone (and are copied to the backend's StaffPractice / StaffTraining tabs once it's deployed).
     Pictures: real screenshots made with scripts/christian-staff-shots.cjs from the guest apps with a fake guest. -->
<style>
:root{--bg:#0b1220;--card:#121c33;--card2:#0f1830;--edge:#24345c;--ink:#f3f6ff;--dim:#a9b6d6;--gold:#f5c400;--mel:#b3263a;--nal:#1673c4;--ok:#2fbf71;--bad:#ff6b6b;--acc:var(--mel)}
body.n{--acc:var(--nal)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
main{max-width:720px;margin:0 auto;padding:12px 16px 90px}
a{color:#8fc2ff}button,input{font:inherit}

.bar{display:flex;gap:8px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}
.seg{display:flex;background:#ffffff0d;border:1px solid var(--edge);border-radius:999px;padding:3px}.seg button{border:0;background:none;color:var(--ink);padding:7px 12px;border-radius:999px;font-weight:800;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold);color:#1a1400}.seg.r button.m[aria-pressed=true]{background:var(--mel);color:#fff}.seg.r button.n[aria-pressed=true]{background:var(--nal);color:#fff}
h1{font-size:26px;line-height:1.15;margin:14px 0 4px}h2{font-size:21px;margin:30px 0 10px;scroll-margin-top:70px}h3{font-size:17px;margin:18px 0 6px;scroll-margin-top:70px}
p{margin:0 0 10px}.s{color:var(--dim)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:14px;margin:10px 0}
.nav{position:sticky;top:0;z-index:5;background:#0b1220ee;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);margin:0 -16px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--edge)}
.nav::-webkit-scrollbar{display:none}.nav a{flex:none;text-decoration:none;color:var(--ink);background:#ffffff10;border:1px solid var(--edge);border-radius:999px;padding:6px 11px;font-weight:700;font-size:14px}
.name{display:flex;gap:8px}.name input{flex:1;min-width:0;padding:11px;border-radius:12px;border:1px solid var(--edge);background:#081022;color:var(--ink);font-size:16px}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--gold);color:#1a1400;text-decoration:none;text-align:center}.btn.alt{background:#ffffff14;color:var(--ink);border:1px solid var(--edge)}
ul.ck{margin:0;padding-left:20px}ul.ck li{margin:5px 0}

.tut{background:var(--card);border:1px solid var(--edge);border-radius:18px;padding:14px;margin:14px 0}
.tut>h3{margin-top:0}

figure{margin:8px 0 4px;border-radius:14px;overflow:hidden;border:1px solid var(--edge);background:#000;max-width:340px}figure img{display:block;width:100%;height:auto}
figcaption{font-size:12.5px;color:var(--dim);padding:6px 10px;background:var(--card2)}
.live{position:relative;overflow:hidden;border-radius:16px;padding:16px;text-align:center;color:#fff;background:linear-gradient(120deg,#1b2a6b,#6b1b5e,#0f6b5c,#7a4a0b,#1b2a6b);background-size:400% 400%;animation:bg 6s linear infinite;max-width:340px}
.live:before{content:"";position:absolute;inset:-50%;background:linear-gradient(105deg,transparent 40%,#ffffff47 50%,transparent 60%);animation:sh 2.2s linear infinite}
.live>*{position:relative}.live .cd{font:900 44px/1 ui-monospace,Menlo,monospace}.live .cl{font:800 14px ui-monospace,Menlo,monospace}.live .co{display:inline-block;font:900 22px ui-monospace,Menlo,monospace;letter-spacing:.12em;background:#0006;border:2px solid #fff9;border-radius:10px;padding:3px 12px;margin-top:6px}
.live.dead{animation:none;background:#2a2d36}.live.dead:before{display:none}.live .stamp{display:none;color:#ff5a4f;border:4px solid #ff5a4f;border-radius:10px;font:900 26px system-ui;transform:rotate(-8deg);margin:6px auto;width:max-content;padding:0 10px}.live.dead .stamp{display:block}
@keyframes bg{to{background-position:400% 50%}}@keyframes sh{0%{transform:translateX(-40%)}100%{transform:translateX(40%)}}

/* Toast screen example (diagram, not a real screenshot) */
.toast{max-width:360px;border-radius:14px;overflow:hidden;border:2px dashed #ff9a2e;background:#f4f5f7;color:#1d2330;font-size:13.5px}
.toast .lbl{background:#ff9a2e;color:#1a0d00;font-weight:900;font-size:12px;letter-spacing:.06em;padding:4px 10px;text-transform:uppercase}
.toast .tbar{background:#ff4c00;color:#fff;font-weight:800;padding:8px 10px;display:flex;justify-content:space-between}
.toast .chk{display:grid;grid-template-columns:1fr 1fr;gap:0}.toast .items{padding:8px;border-right:1px solid #d8dbe2}.toast .items div{padding:6px 8px;border-radius:8px;margin:3px 0;background:#fff;display:flex;justify-content:space-between}
.toast .items div.sel{outline:3px solid #ff2d55;background:#ffe9ee}.toast .acts{padding:8px;display:grid;gap:6px;align-content:start}.toast .acts span{background:#3a4560;color:#fff;border-radius:8px;padding:8px;text-align:center;font-weight:800}
.toast .acts span.hi{outline:3px solid #ff2d55;background:#ff4c00}.toast .disc{padding:8px;border-top:1px solid #d8dbe2;display:grid;gap:6px}.toast .disc span{background:#fff;border:1px solid #c9ced8;border-radius:8px;padding:8px;font-weight:700}.toast .disc span.hi{outline:3px solid #ff2d55;background:#fff3c4}
.toast .rsn{padding:8px;border-top:1px solid #d8dbe2}.toast .rsn i{display:block;font-style:normal;background:#fff;border:2px solid #ff2d55;border-radius:8px;padding:7px;font-family:ui-monospace,Menlo,monospace;font-weight:800}
.toast .badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:11px;background:#ff2d55;color:#fff;font-weight:900;font-size:12px;margin-right:6px;vertical-align:middle}
details{border-top:1px solid var(--edge);padding:9px 0}details:first-of-type{border-top:0}summary{cursor:pointer;font-weight:700}details p{margin:6px 0 0;color:var(--dim)}
.say{border-left:4px solid var(--gold);padding:6px 12px;margin:8px 0;background:#ffffff08;border-radius:0 10px 10px 0}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}.games a{display:block;text-decoration:none;color:#fff;border-radius:16px;padding:14px;font-weight:900;text-align:center}.games .m{background:linear-gradient(135deg,#5a1420,#b3263a)}.games .n{background:linear-gradient(135deg,#ff8a2b,#1673c4)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.tally div{background:var(--card2);border:1px solid var(--edge);border-radius:12px;padding:8px;text-align:center}.tally b{display:block;font-size:22px}.tally span{font-size:12px;color:var(--dim)}
.q{background:var(--card2);border:1px solid var(--edge);border-radius:14px;padding:12px;margin:10px 0}.q .opts{display:grid;gap:6px;margin-top:8px}.q button.o{text-align:left;background:#ffffff0d;border:1px solid var(--edge);color:var(--ink);border-radius:10px;padding:10px;cursor:pointer}
.q button.o.right{background:#2fbf7133;border-color:var(--ok)}.q button.o.wrong{background:#ff6b6b33;border-color:var(--bad)}.q .fb{margin-top:8px;font-size:14.5px}
.badge2{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#123024,#121c33);border:1px solid #2fbf7188;border-radius:16px;padding:12px 14px;margin:10px 0}.badge2 b{font-size:20px;color:#8ff0bd}
.note{font-size:13px;color:var(--dim)}
[hidden]{display:none!important}
.lsr{margin:2px 0 10px}
