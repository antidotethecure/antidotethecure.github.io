  [].forEach.call(dpc.children,function(b){ b.classList.toggle("on",cur.indexOf(b.textContent)>=0); }); }
drawRefresh();

// promo codes
app.appendChild(h("h2",null,"Promo codes to launch with"));
app.appendChild(h("p","sub","Turn on the codes you want. Keep the suggested value or type your own."));
function codeName(c,val){ var m=String(val||"").match(/\d+/); return c[1].replace("{n}",m?m[0]:""); }
function codeState(c){ var s=S["code:"+c[0]]; return s&&typeof s==="object"?s:{on:true,v:c[3][0]}; }
CODES.forEach(function(c){
  var card=h("div","card"), st=codeState(c), r=h("div","row"), lab=h("div","q"), nm=h("span","code"), tx=h("span",null,c[2]);
  lab.appendChild(nm); lab.appendChild(tx); r.appendChild(lab);
  var tg=h("button","tg"); tg.type="button"; tg.setAttribute("aria-label","Use code "+c[1]); r.appendChild(tg); card.appendChild(r);
  function draw(){ nm.textContent=codeName(c,st.v); tg.classList.toggle("on",st.on); card.classList.toggle("off",!st.on); }
  tg.onclick=function(){ st.on=!st.on; S["code:"+c[0]]=st; save(); draw(); };
  fillIn(card,c[4]||F("reward"),c[3][0],c[3],function(){ return st.v===c[3][0]?null:st.v; },function(x){ st.v=x==null?c[3][0]:x; S["code:"+c[0]]=st; save(); draw(); });
  draw(); app.appendChild(card);
});
if(CFG.alcohol) app.appendChild(h("p","hint","Codes can take money off drinks, but can't give a free alcoholic drink (California)."));

// holiday specials: one card per holiday, soonest first. The suggestions are the samples in the demo app's
// window.SPECIALS (demo/specials.js, pulled in by build.py as CFG.holidays). Saved as S["hol:<id>"].
// "Text it to my customers?": marketing texts only go to members who tapped "Text me deals" at sign-up (prior express
// written consent, TCPA), every text ends with "Reply STOP to opt out", and nothing sends outside 8 AM–9 PM local.
// Texting is part of the AI text agent add-on ($49/mo); the owner approves every blast (demo/crm.js "Holiday blast").
var HOL_N={halloween:["🎃","Halloween"],thanksgiving:["🦃","Thanksgiving"],christmas:["🎄","Christmas"],newyear:["🎆","New Year's"],valentines:["💘","Valentine's Day"],
  stpatricks:["☘️","St. Patrick's Day"],cinco:["🪅","Cinco de Mayo"],july4:["🇺🇸","Fourth of July"],custom:["⭐","Your own special"]};
var HTODAY=(function(){ try{ var p={}; new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).forEach(function(x){ p[x.type]=x.value; });
  return {y:+p.year,md:p.month+"-"+p.day}; }catch(e){ var d=new Date(); return {y:d.getFullYear(),md:("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}; } })();
var HMON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function hFmt(iso){ return iso?HMON[+iso.slice(5,7)-1]+" "+(+iso.slice(8,10)):"(no date)"; }
function hDates(sp){ if(!sp.start||!sp.end) return {s:"",e:""};   // the next window that hasn't ended yet
  var ey=sp.end>=HTODAY.md?HTODAY.y:HTODAY.y+1, sy=sp.start>sp.end?ey-1:ey; return {s:sy+"-"+sp.start,e:ey+"-"+sp.end}; }
var HOLS=(CFG.holidays||[]).map(function(sp){ var d=hDates(sp); return {sp:sp,s:d.s,e:d.e}; }).sort(function(a,b){ return a.s<b.s?-1:a.s>b.s?1:0; });
if(HOLS.length) HOLS.push({sp:{id:"custom",holiday:"custom",title:"",desc:"",item:""},s:"",e:"",off:true});
var HKIND=[["menu","Menu price"],["price","Set a price"],["pct","% off"],["usd","$ off"]];
function holState(x){ var k="hol:"+x.sp.id, s=S[k]; if(s&&typeof s==="object") return s;
  return {on:!x.off,title:x.sp.title||"",item:x.sp.item||"",kind:"menu",val:"",start:x.s,end:x.e,text:"No",send:x.s}; }
function holDeal(st){ var v=String(st.val||"").replace(/[^\d.]/g,"");
  if(st.kind==="price") return v?"$"+v:"(price not set)"; if(st.kind==="pct") return v?v+"% off":"(% not set)"; if(st.kind==="usd") return v?"$"+v+" off":"($ not set)"; return "menu price"; }
var HITEMS=document.createElement("datalist"); HITEMS.id="hol-items";
(CFG.menu.food||[]).concat(CFG.menu.drinks||[]).forEach(function(g){ g.items.forEach(function(i){ var o=document.createElement("option"); o.value=i[0]; HITEMS.appendChild(o); }); });
document.body.appendChild(HITEMS);
if(HOLS.length){
  app.appendChild(h("h2",null,"Holiday specials"));
  app.appendChild(h("p","sub","A banner shows at the top of your app while each one is running, and it's listed on your menu. We filled in ideas from your menu. Turn each one on or off, and change anything."));
  if(CFG.alcohol) app.appendChild(h("p","note","Drink specials are discounts only (like 20% off). California rules don't allow free alcohol."));
  HOLS.forEach(function(x){
    var sp=x.sp, nm=HOL_N[sp.holiday]||HOL_N.custom, key="hol:"+sp.id, st=holState(x), card=h("div","card"); card.dataset.key=key; card.dataset.hol=sp.id;
    function put(){ S[key]=st; save(); }
    var r=h("div","row"), lab=h("div","q"); lab.appendChild(document.createTextNode(nm[0]+" "+nm[1]));
    var when=h("div","hint"); lab.appendChild(when); r.appendChild(lab);
    var tg=h("button","tg"); tg.type="button"; tg.setAttribute("aria-label","Run the "+nm[1]+" special"); r.appendChild(tg); card.appendChild(r);
    var body=h("div"); card.appendChild(body);
    function field(label,el,hint){ var w=h("div"); w.style.marginTop="12px"; w.appendChild(h("div","q",label)); if(hint) w.appendChild(h("div","hint",hint)); w.appendChild(el); body.appendChild(w); return w; }
    function textBox(val,ph,list,on){ var b=h("label","box wide"), i=h("input"); i.type="text"; i.value=val||""; i.placeholder=ph; i.autocomplete="off"; if(list) i.setAttribute("list",list); i.oninput=function(){ on(i.value); }; b.appendChild(i); return b; }
    function dateBox(val,aria,on){ var b=h("label","box"), i=h("input"); i.type="date"; i.value=val||""; i.setAttribute("aria-label",aria); i.style.fontSize="16px"; i.onchange=i.oninput=function(){ on(i.value); }; b.appendChild(i); b.style.flex="1 1 140px"; return b; }
    field("Special name",textBox(st.title,sp.title||"e.g. Taco Night",null,function(v_){ st.title=v_; put(); }),sp.title?"Suggested: "+sp.title:null);
    field("What it is",textBox(st.item,sp.item||"Pick a menu item or type it","hol-items",function(v_){ st.item=v_; put(); }),sp.desc?"Our idea: "+sp.desc:"Pick a menu item, or type what's in the deal.");
    var pw=h("div"), seg=h("div","seg"), amt=h("div","amt"), segB={};
    HKIND.forEach(function(k){ var b=h("button",null,k[1]); b.type="button"; b.onclick=function(){ st.kind=k[0]; if(k[0]==="menu") st.val=""; put(); drawK(true); }; seg.appendChild(b); segB[k[0]]=b; });
    pw.appendChild(seg); pw.appendChild(amt); field("Price or % off",pw,"Leave it on Menu price, or set a holiday price or discount.");
    function drawK(focus){ Object.keys(segB).forEach(function(k){ segB[k].classList.toggle("on",st.kind===k); }); amt.innerHTML="";
      if(st.kind==="menu"){ amt.appendChild(h("div","hint","Uses the regular menu price.")); return; }
      var b=h("label","box"), i=h("input"); i.type="text"; i.inputMode="decimal"; i.autocomplete="off"; i.value=st.val||""; i.placeholder=st.kind==="pct"?"20":st.kind==="usd"?"5":"19.99"; i.setAttribute("aria-label",st.kind==="pct"?"Percent off":"Dollars");
      if(st.kind!=="pct") b.appendChild(h("span","pre","$")); b.appendChild(i); if(st.kind==="pct") b.appendChild(h("span","suf","%"));
      if(st.kind!=="price") amt.appendChild(b), amt.appendChild(h("span","unit","off")); else amt.appendChild(b);
      i.oninput=function(){ st.val=i.value.replace(/[^\d.]/g,""); put(); }; if(focus) try{ i.focus(); }catch(e){} }
    var dates=h("div","amt"), ds=dateBox(st.start,"Start date",function(v_){ st.start=v_; put(); drawW(); }), de=dateBox(st.end,"End date",function(v_){ st.end=v_; put(); drawW(); });
    dates.appendChild(ds); dates.appendChild(h("span","unit","to")); dates.appendChild(de); field("Runs",dates);
    var tw=h("div"), sendRow=h("div","amt"), sendBox=dateBox(st.send,"Send date",function(v_){ st.send=v_; put(); }); sendRow.appendChild(h("span","unit","Send on")); sendRow.appendChild(sendBox);
    tw.appendChild(chipRow(key+":text",YN,st.text,function(o){ st.text=o; if(o==="Yes"&&!st.send) st.send=st.start; put(); drawT(); })); tw.appendChild(sendRow);
    field("Text it to my customers?",tw,"Goes only to customers who tapped \"Text me deals\" when they signed up. Sent between 8 AM and 9 PM, and anyone can reply STOP. You approve it before it goes out. Part of the AI text agent add-on ($49/mo).");
    function drawT(){ sendRow.classList.toggle("hide",st.text!=="Yes"); }
    function drawW(){ when.textContent=st.start&&st.end?hFmt(st.start)+" – "+hFmt(st.end):"Pick your dates"; }
    function drawOn(){ tg.classList.toggle("on",!!st.on); body.classList.toggle("hide",!st.on); card.classList.toggle("off",false); }
    tg.onclick=function(){ st.on=!st.on; put(); drawOn(); };
    drawK(false); drawT(); drawW(); drawOn(); app.appendChild(card);
  });
}
function holSummary(){ if(!HOLS.length) return [];
  var out=["\nHOLIDAY SPECIALS"];
  HOLS.forEach(function(x){ var st=holState(x), nm=HOL_N[x.sp.holiday]||HOL_N.custom;
    if(!st.on){ out.push("• "+nm[0]+" "+nm[1]+": OFF"); return; }
    out.push("• "+nm[0]+" "+nm[1]+" ("+hFmt(st.start)+" – "+hFmt(st.end)+"): ON · "+(st.title||"(no name)")+" · "+(st.item||"(no item)")+" · "+holDeal(st)+
      " · text customers: "+(st.text==="Yes"?"Yes, on "+hFmt(st.send||st.start):"No")); });
  return out; }

// your register (POS): which system + how to start, with a deep link to the step-by-step guide
var POSES=[["toast","Toast"],["square","Square"],["clover","Clover"],["spoton","SpotOn"],["lightspeed","Lightspeed"],["revel","Revel"],["other","Something else"],["none","No POS"]];
var POS_START=["Discount buttons now (Avenue A)","Full connection (Avenue B)","Not sure, walk me through it"];
app.appendChild(h("h2",null,"Your register (POS)"));
app.appendChild(h("p","sub","So staff can take app rewards off at the register. Tap what you use. Nothing changes until we set it up together."));
var pq=h("div","card"); pq.appendChild(h("div","q","What do you ring up on?"));
var posLink=h("a","golink hide"); posLink.target="_blank"; posLink.rel="noopener";
function posName(){ var m=POSES.filter(function(x){ return x[0]===S.pos; })[0]; return m?m[1]:null; }
function posDraw(){ var nm=posName(); if(!nm){ posLink.classList.add("hide"); return; }
  posLink.textContent="Open the step-by-step for "+nm+" →";
  posLink.href="/pos/?pos="+encodeURIComponent(S.pos)+"&r="+encodeURIComponent(SHORT); posLink.classList.remove("hide"); }
pq.appendChild(chipRow("pos",POSES.map(function(x){ return x[1]; }),posName(),function(o){ S.pos=POSES.filter(function(x){ return x[1]===o; })[0][0]; save(); posDraw(); }));
pq.appendChild(posLink); app.appendChild(pq); posDraw();
var ps=h("div","card"); ps.appendChild(h("div","q","How do you want to start?"));
ps.appendChild(h("div","hint","Avenue A works today: a few discount buttons in your POS, about 10 minutes. Avenue B connects the app to your POS directly, so points post by themselves."));
ps.appendChild(chipRow("posStart",POS_START,S.posStart||null,function(o){ S.posStart=o; save(); }));
app.appendChild(ps);

// menu: on/off + prices
function itemRow(key,name,price,web,mp){
  var c=h("div","card"), st=S[key]||{on:true,p:price};
  var r=h("div","row"); r.appendChild(h("div","q",name)); var tg=h("button","tg"+(st.on?" on":"")); tg.type="button"; tg.setAttribute("aria-label","On the menu");
  r.appendChild(tg); c.appendChild(r);
  function draw(){ if(v_) v_.textContent=money(st.p); c.classList.toggle("off",!st.on); tg.classList.toggle("on",st.on); }
  tg.onclick=function(){ st.on=!st.on; S[key]=st; draw(); save(); };
  var v_=null;
  if(typeof price==="number"){
    var p=h("div","price"), m=h("button",null,"−"), pl=h("button",null,"+"); v_=h("b"); m.type=pl.type="button"; m.setAttribute("aria-label","Lower price"); pl.setAttribute("aria-label","Raise price");
    m.onclick=function(){ st.p=Math.max(0,Math.round((st.p-.25)*100)/100); S[key]=st; draw(); save(); };
    pl.onclick=function(){ st.p=Math.round((st.p+.25)*100)/100; S[key]=st; draw(); save(); };
    p.appendChild(m); p.appendChild(v_); p.appendChild(pl);
    if(web){ var w=h("button","chip","Website price "+money(web)); w.type="button"; w.onclick=function(){ st.p=web; S[key]=st; draw(); save(); }; p.appendChild(w); }
    c.appendChild(p); c.appendChild(h("div","hint","Tap the switch if it's not on the menu anymore. ± changes the price by 25¢."));
  } else {
    c.appendChild(h("span","mp",mp?"Market price":"Price not on file yet"));
    c.appendChild(h("div","hint",mp?"Market price stays as is. Tap the switch if it's not on the menu anymore.":"Antidote will confirm this price with you. Tap the switch if it's not on the menu anymore."));
  }
  draw(); return c;
}
var M=CFG.menu;
function eachItem(fn){ M.drinks.forEach(function(g){ g.items.forEach(function(i){ fn("d:"+i[0],i,g); }); }); M.food.forEach(function(g){ g.items.forEach(function(i){ fn("f:"+i[0],i,g); }); }); }
if(CFG.menuNote) app.appendChild(h("p","note",CFG.menuNote));
if(M.drinks.length){
  app.appendChild(h("h2",null,CFG.drinksTitle||"Drinks in the app"));
  M.drinks.forEach(function(g){ if(M.drinks.length>1) app.appendChild(h("p","sub",g.name)); g.items.forEach(function(i){ app.appendChild(itemRow("d:"+i[0],i[0],i[1],i[2],i[3])); }); });
}
M.food.forEach(function(g){ app.appendChild(h("h2",null,"Menu: "+g.name)); g.items.forEach(function(i){ app.appendChild(itemRow("f:"+i[0],i[0],i[1],i[2],i[3])); }); });

app.appendChild(h("h2",null,"Last thing"));
var last=h("div","card"); last.appendChild(h("div","q","Ready for Antidote to put these live?"));
last.appendChild(chipRow("approved",["Yes, put it live","Show me a preview first"],S.approved||null,function(o){ S.approved=o; save(); }));
app.appendChild(last);
refresh();

window.SETUP_SUMMARY = function () { return summary(); };   // lets the owner's launch checklist (/launch/…) collect these answers
function summary(){
  var out=[CFG.name.toUpperCase()+" SETUP (from "+(OWNER==="there"?"the owner":OWNER)+")"];
  Q.forEach(function(sec){ out.push("\n"+sec[0].toUpperCase()); sec[1].forEach(function(q){
    if(q[4]&&!q[4](S)){ out.push("• "+lab(q)+": "+(q[4]===oneBal&&wOn()?"(using bar + kitchen points instead)":"(skipped)")); return; }
    var x=v(q[0]); out.push("• "+lab(q)+": "+(x==null?"(no answer)":x)); });
    if(sec===Q[0]) out.push("• Free entry with no purchase: included (California law)"); });
  var dOdds=drawOdds(); out.push("\nDAILY LUCKY DRAW (MEMBERS)"); out.push("• How often someone wins: "+dOdds);
  if(dOdds!=="Off"){ var dpz=drawPrizes(); out.push("• Prizes: "+(dpz.length?dpz.join(", "):"(none picked)")); out.push("• Winners redeem within: 3 days"); }
  out.push("\nPROMO CODES"); CODES.forEach(function(c){ var st=codeState(c); out.push("• "+codeName(c,st.v)+" – "+c[2]+": "+(st.on?"ON, "+st.v:"OFF")); });
  out=out.concat(holSummary());
  var ch=[]; eachItem(function(key,i){ var s=S[key]; if(s&&(!s.on||(typeof i[1]==="number"&&s.p!==i[1]))) ch.push("• "+i[0]+": "+(s.on?(typeof i[1]==="number"?money(s.p):"keep"):"REMOVE")); });
  out.push("\nYOUR REGISTER (POS)"); out.push("• What you ring up on: "+(posName()||"(no answer)")); out.push("• How you want to start: "+(S.posStart||"(no answer)"));
  out.push("\nMENU CHANGES"); out.push(ch.length?ch.join("\n"):"• No changes");
  out.push("\nGo live: "+(S.approved||"(no answer)"));
  return out.join("\n");
}
window.__setupSummary=summary;
$("send").onclick=function(){
  var t=summary();
  if(navigator.share){ navigator.share({title:SHORT+" setup",text:t}).catch(function(){}); }
  else { location.href="sms:&body="+encodeURIComponent(t); }
};
})();
