<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1b2b52"/>
      <stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#f5c400"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd6a6"/>
      <stop offset="1" stop-color="#2fbf71"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2a35f"/>
      <stop offset="1" stop-color="#b8743a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- sun (Sunshine) -->
  <g stroke="#f5c400" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="117" y1="97" x2="135" y2="115"/><line x1="395" y1="97" x2="377" y2="115"/>
    <line x1="60" y1="236" x2="86" y2="236"/><line x1="452" y1="236" x2="426" y2="236"/>
  </g>
  <circle cx="256" cy="236" r="146" fill="url(#sun)"/>
  <!-- church (Green Light Sanctuary) silhouette -->
  <g transform="translate(256 300) scale(1.3) translate(-256 -300)">
  <g fill="#0b1220">
    <rect x="249" y="96" width="14" height="52" rx="2"/>
    <rect x="236" y="110" width="40" height="13" rx="2"/>
    <polygon points="256,140 286,196 226,196"/>
    <rect x="232" y="192" width="48" height="150"/>
    <polygon points="196,250 256,206 316,250"/>
    <rect x="204" y="246" width="104" height="96"/>
  </g>
  <!-- green light window + door -->
  <path d="M244 214 a12 12 0 0 1 24 0 v22 h-24 z" fill="#2fbf71"/>
  </g>
  <!-- hill -->
  <path d="M0 336 C 120 300, 330 300, 512 330 L512 512 L0 512 Z" fill="url(#hill)"/>
  <path d="M0 392 C 150 360, 360 372, 512 386 L512 512 L0 512 Z" fill="#1f8f55"/>
  <!-- flower (iDesignEvents) -->
  <g transform="translate(112 400) scale(1.45)">
    <path d="M0 26 C -2 50, 4 70, 0 92" stroke="#0e5a35" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g fill="#ffb3c7">
      <circle cx="0" cy="-20" r="17"/>
      <circle cx="19" cy="-6" r="17"/>
      <circle cx="12" cy="16" r="17"/>
      <circle cx="-12" cy="16" r="17"/>
      <circle cx="-19" cy="-6" r="17"/>
    </g>
    <circle cx="0" cy="0" r="11" fill="#f5c400"/>
  </g>
  <!-- mushroom (Sunshine Mushroom Wellness) -->
  <g transform="translate(360 336) scale(1.25)">
    <ellipse cx="0" cy="116" rx="54" ry="9" fill="#0b1220" opacity="0.22"/>
    <path d="M-30 40 C -34 80, -36 104, -40 116 L 40 116 C 36 104, 34 80, 30 40 Z" fill="#f3f6ff"/>
    <path d="M-98 44 C -98 -40, 98 -40, 98 44 C 60 54, -60 54, -98 44 Z" fill="url(#cap)"/>
    <path d="M-98 44 C -60 54, 60 54, 98 44 C 70 60, -70 60, -98 44 Z" fill="#f3e6cf"/>
    <ellipse cx="-38" cy="0" rx="20" ry="11" fill="#f3e6cf" opacity="0.55" transform="rotate(-20 -38 0)"/>
  </g>
