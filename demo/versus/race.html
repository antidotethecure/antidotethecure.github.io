<!-- SousShift AI — MENU DASH: the Venue Versus runner race (2–4 players, about 90 seconds). An ORIGINAL game: our own names, art,
     obstacles and power-ups (nothing from any other runner game). One thumb: tap = jump, tap again in the air = double jump,
     swipe down = slide. Keys: Space / ↑ jump, ↓ slide. Controller: A jump, X or down slide (gamepad.js).
     Opened by ../versus.js when the lobby matches you (#m=<match>), or ?practice=1 to race three practice bots.
     The server (match room) owns the start, checks every runner's distance against the top speed and the finish time against its
     own clock, and decides the order. House rules: gamepad.js right after lang-th.js + window.__MD, Full screen (fullscreen.js) +
     manual 🔒 lock (gamelock.js), the restaurant's review poster always on screen (reviewegg.js + the poster card), halftime only
     between practice races (never mid-race), holiday themes pause while you run (seasons.js), "Powered by SousShift AI". -->

<style>

<script>
/* ===================== MENU DASH ===================== */
(function(){
"use strict";
var q=new URLSearchParams(location.search), SLUG=(q.get("slug")||"melody").replace(/[^a-z0-9-]/g,"");
var V=(window.VERSUS_VENUES||{})[SLUG]||{name:"Venue Versus",theme:{},dash:{}}, DASH=V.dash||{};
var T=V.theme||{}, rs=document.documentElement.style;
[["bg","--bg"],["panel","--panel"],["edge","--edge"],["accent","--acc"],["accent2","--acc2"],["wine","--wine"],["ink","--ink"],["dim","--dim"],["go","--go"],["display","--disp"],["body","--body"]].forEach(function(p){ if(T[p[0]]) rs.setProperty(p[1],T[p[0]]); });
if(V.fonts){ var lk=document.createElement("link"); lk.rel="stylesheet"; lk.href=V.fonts; document.head.appendChild(lk); }
var $=function(i){ return document.getElementById(i); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
$("vname").textContent="Venue Versus · "+(V.name||"");
if(V.poster){ $("posterimg").src=V.poster; $("poster").href=V.review||"#"; } else $("poster").remove();
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- match info from the lobby (#m=…) or practice ---- */
var M=null; try{ var mh=location.hash.match(/#m=(.+)$/); if(mh) M=JSON.parse(decodeURIComponent(mh[1])); }catch(e){ M=null; }
if(M&&!/^[a-z0-9]{6,12}$/.test(String(M.id||""))) M=null;
var BACK=(M&&M.back&&/^https?:\/\//.test(M.back))?M.back:(V.app?V.app+"#versus":"../");
$("back").href=BACK;
var API=M?String(M.api||V.api||"").replace(/\/+$/,"")+"/api/versus":"";
var off=M?(+M.off||0):0; function now(){ return Date.now()+off; }
var AUTO=q.get("autopilot")==="1"&&(!M||/^(127\.0\.0\.1|localhost)$/.test(location.hostname));   // test hook: your runner plays itself (practice, or a local test server only)

/* ---- the course: identical for every racer (same seed) ---- */
var W=720, H=405, GY=338, PX=170, TRACK=26000, VBASE=300, VTOP=330, VMAX=480, G=2400, J1=820, J2=720;
function mb32(a){ return function(){ a=(a+0x6D2B79F5)>>>0; var t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
var OBS_K=["plates","meatball","skillets","flames","soda"];
var OBS_N={plates:"Plate Stack",meatball:"Rolling Meatball",skillets:"Hanging Skillets",flames:"Grill Flames",soda:"Soda Spill"};
var PU=[["boost","⚡",(DASH.boost||{}).name||"Fries","Speed boost for 2.5 s"],["shield","🛡️",(DASH.shield||{}).name||"Mac & Cheese","Blocks the next hit"],["wings","🪽",(DASH.magnet||{}).name||"Wings","Triple jump for 6 s"],["blast","💥",(DASH.rocket||{}).name||"Burger","Trips up the racer just ahead"]];
function course(seed){
  var r=mb32(seed||1), gaps=[], obs=[], crates=[], x=900;
  while(x<TRACK-600){
    var k=r();
    if(k<.22){ var w=90+Math.round(r()*70); gaps.push([x,x+w]); x+=w+260+r()*160; }
    else { var t=OBS_K[Math.floor(r()*OBS_K.length)]; obs.push({k:t,x:x,w:t==="flames"?70:t==="soda"?80:t==="skillets"?56:40}); x+=300+r()*260; }
    if(r()<.3){ crates.push({x:x-120,y:GY-110-r()*40,k:PU[Math.floor(r()*PU.length)][0]}); }
  }
  return {gaps:gaps,obs:obs,crates:crates};
}
function onGround(d){ for(var i=0;i<C.gaps.length;i++){ var g=C.gaps[i]; if(d>g[0]+6&&d<g[1]-6) return false; } return true; }
function gapAt(d){ for(var i=0;i<C.gaps.length;i++){ var g=C.gaps[i]; if(d>g[0]+6&&d<g[1]-6) return g; } return null; }

/* ---- art ---- */
var IM={}; function img(k,src){ if(!src) return; var i=new Image(); i.src=src; IM[k]=i; }
img("boost",(DASH.boost||{}).img); img("shield",(DASH.shield||{}).img); img("wings",(DASH.magnet||{}).img); img("blast",(DASH.rocket||{}).img); img("logo",V.logo); img("poster",V.poster);
(DASH.coins||[]).forEach(function(s,i){ img("deco"+i,s); });
function ok(i){ return i&&i.complete&&i.naturalWidth; }
$("pucards").innerHTML="<b>Menu power-ups</b> (crates): "+PU.map(function(p){ return (ok(IM[p[0]])||IM[p[0]]?'<img alt="" src="'+esc(IM[p[0]].src)+'">':p[1])+esc(p[2])+": "+esc(p[3]); }).join(" · ");
var COLS=["#f0d375","#5fd0ff","#ff7aa2","#7dff9a"];

var cv=$("game"), cx=cv.getContext("2d"), DPR=Math.min(2,window.devicePixelRatio||1); cv.width=W*DPR; cv.height=H*DPR; cx.scale(DPR,DPR);

/* ---- state ---- */
var C=null, ME=null, RIV=[], S={running:false,over:false,mode:M?"race":"practice"}, startAt=0, raf=0, last=0, ws=null, sendT=0, result=null, myIdx=-1;
function runner(n,col,bot){ return {n:n,col:col,bot:!!bot,d:0,y:GY,vy:0,v:VBASE,air:0,jumps:0,slide:0,stun:0,inv:0,boost:0,shield:0,wings:0,fall:0,fin:0,flash:0,anim:0,ai:bot?mb32(Math.floor(Math.random()*1e9)):null,buf:[]}; }
function reset(seed){ C=course(seed); ME=runner("You",COLS[0]); if(AUTO) ME.ai=mb32(7); RIV=RIV.filter(function(r){ return r.remote; }); result=null; }   // remote racers (from the match room) survive the reset

/* ---- input: one thumb ---- */
var tStart=null;
function jump(){ if(!S.running||ME.fin||ME.fall||ME.stun>0) return; var max=ME.wings>0?3:2;
  if(!ME.air){ ME.vy=-J1; ME.air=1; ME.jumps=1; ME.slide=0; snd("jump"); } else if(ME.jumps<max){ ME.vy=-J2; ME.jumps++; snd("jump2"); } }
function slide(){ if(!S.running||ME.fin||ME.fall) return; if(ME.air){ ME.vy=Math.max(ME.vy,900); } ME.slide=.6; snd("slide"); }
cv.addEventListener("pointerdown",function(e){ if(!S.running) return; tStart={x:e.clientX,y:e.clientY,t:performance.now(),did:0}; });
cv.addEventListener("pointermove",function(e){ if(!tStart||tStart.did) return; if(e.clientY-tStart.y>28&&Math.abs(e.clientY-tStart.y)>Math.abs(e.clientX-tStart.x)){ tStart.did=1; slide(); } });
cv.addEventListener("pointerup",function(){ if(tStart&&!tStart.did) jump(); tStart=null; });
cv.addEventListener("pointercancel",function(){ tStart=null; });
document.addEventListener("keydown",function(e){ if(!S.running) return; if(e.key===" "||e.key==="ArrowUp"||e.key==="w"){ e.preventDefault(); if(!e.repeat) jump(); } else if(e.key==="ArrowDown"||e.key==="s"){ e.preventDefault(); if(!e.repeat) slide(); } });

/* ---- sound (tiny WebAudio blips, created on the first tap) ---- */
var AC=null; function snd(k){ try{ if(!AC){ var A=window.AudioContext||window.webkitAudioContext; if(!A) return; AC=new A(); } if(AC.state==="suspended") AC.resume();
  var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime, f={jump:520,jump2:700,slide:220,hit:120,pu:880,fin:990,fall:160}[k]||440;
  o.type=k==="hit"||k==="fall"?"sawtooth":"triangle"; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(k==="fall"?60:f*1.5,t+.12); g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.2); }catch(e){} }

/* ---- physics ---- */
function hitBox(r){ var h=r.slide>0&&!r.air?26:52; return {x0:r.d-14,x1:r.d+14,y0:r.y-h,y1:r.y}; }
function stumble(r,why){ if(r.inv>0||r.fin) return; if(r.shield>0){ r.shield=0; r.inv=.8; r.flash=.5; if(r===ME){ toast("🛡️ "+PU[1][2]+" blocked it!"); snd("pu"); } return; }
  r.stun=.75; r.inv=1.6; r.boost=0; if(r===ME){ snd("hit"); toast(why); if(navigator.vibrate) try{ navigator.vibrate(40); }catch(e){} } }
function step(r,dt){
  r.anim+=dt*(r.v/VBASE);
  if(r.fin){ r.v=Math.max(0,r.v-400*dt); r.d+=r.v*dt; return; }
  if(r.fall){ r.fall-=dt; r.y+=500*dt; if(r.fall<=0){ var g=gapAt(r.d)||[r.d,r.d]; r.d=g[0]-30; r.y=GY; r.vy=0; r.air=0; r.jumps=0; r.fall=0; r.inv=1.2; r.v=VBASE*.7; } return; }
  if(r.stun>0){ r.stun-=dt; r.v=110; } else { var tgt=r.boost>0?VMAX:Math.min(VTOP,VBASE+r.d/TRACK*60)*(r.skill||1); r.v+=(tgt-r.v)*Math.min(1,dt*(r.boost>0?6:1.6)); }
  ["boost","shield","wings","inv","flash","slide"].forEach(function(k){ if(r[k]>0) r[k]=Math.max(0,r[k]-dt); });
  r.d+=Math.min(VMAX,r.v)*dt;
  // vertical
  r.vy+=G*dt; r.y+=r.vy*dt;
  var solid=onGround(r.d);
  if(r.y>=GY&&solid){ r.y=GY; r.vy=0; if(r.air){ r.air=0; r.jumps=0; } }
  else if(r.y>=GY&&!solid){ r.air=1; if(r.y>GY+40){ r.fall=.9; if(r===ME){ snd("fall"); toast("💦 Into the dish pit! Back in a sec…"); } } }
  else if(r.y<GY) r.air=1;
  // obstacles
  var b=hitBox(r);
  for(var i=0;i<C.obs.length;i++){ var o=C.obs[i], ox=o.k==="meatball"?o.x-((now()-startAt)/1000)*90:o.x; if(ox>r.d+40) break; if(ox+o.w<r.d-40) continue;
    var y0,y1; if(o.k==="skillets"){ y0=GY-130; y1=GY-34; } else if(o.k==="soda"){ y0=GY-6; y1=GY; } else if(o.k==="flames"){ y0=GY-34; y1=GY; } else if(o.k==="meatball"){ y0=GY-40; y1=GY; } else { y0=GY-48; y1=GY; }
    if(b.x1>ox&&b.x0<ox+o.w&&b.y1>y0&&b.y0<y1){ if(o.k==="soda"){ if(!r.air){ r.v=Math.min(r.v,190); } } else stumble(r,"💥 "+OBS_N[o.k]+"!"); } }
  // crates (everyone sees the same crates; each racer can grab each crate once)
  for(var c=0;c<C.crates.length;c++){ var cr=C.crates[c]; if((r.got||(r.got={}))[c]) continue; if(Math.abs(cr.x-r.d)<26&&Math.abs(cr.y-(r.y-26))<40){ r.got[c]=1; power(r,cr.k); } }
  if(r.d>=TRACK&&!r.fin){ r.fin=now()-startAt; if(r===ME) finish(); }
}
function power(r,k){
  if(k==="boost") r.boost=2.5; else if(k==="shield") r.shield=10; else if(k==="wings") r.wings=6;
  else if(k==="blast"){ var ahead=leader(r); if(ahead){ if(S.mode==="race"&&ahead.idx!=null&&r===ME) net({t:"fx",to:ahead.idx,k:"blast"}); else stumble(ahead,"🍔 Burger Blast from "+r.n+"!"); } }
  if(r===ME){ var p=PU.filter(function(x){ return x[0]===k; })[0]; snd("pu"); toast(p[1]+" "+p[2]+": "+p[3]+(k==="blast"&&!leader(r)?" (nobody ahead!)":"")); }
}
function leader(r){ var best=null; RIV.concat([ME]).forEach(function(x){ if(x!==r&&x.d>r.d&&!x.fin&&(!best||x.d<best.d)) best=x; }); return best; }

/* ---- practice bots ---- */
function botThink(b){
  if(b.fin||b.fall||b.stun>0) return;
  var look=b.d+70+b.v*.12, err=b.ai()<(b===ME?.004:.03);
  for(var i=0;i<C.obs.length;i++){ var o=C.obs[i]; if(o.x>look) break; if(o.x+o.w<b.d) continue; if(o.x-b.d<90&&!b.air&&!b.slide){ if(err) return; if(o.k==="skillets") b.slide=.6; else if(o.k!=="soda"){ b.vy=-J1; b.air=1; b.jumps=1; } } }
  var g=null; for(var j=0;j<C.gaps.length;j++){ var gg=C.gaps[j]; if(gg[0]>b.d&&gg[0]-b.d<60){ g=gg; break; } }
  if(g&&!b.air&&!err){ b.vy=-J1; b.air=1; b.jumps=1; }
}

/* ---- networking (race mode) ---- */
function net(o){ if(ws&&ws.readyState===1) try{ ws.send(JSON.stringify(o)); }catch(e){} }
function connect(){
  var u=API.replace(/^http/,"ws")+"/match/ws?slug="+encodeURIComponent(SLUG)+"&game=race&id="+M.id+"&dev="+encodeURIComponent(M.dev)+"&tok="+encodeURIComponent(M.tok);
  try{ ws=new WebSocket(u); }catch(e){ ws=null; return; }
  ws.onmessage=function(ev){ var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.t==="mstate"){ if(m.you>=0) myIdx=m.you; off=m.now-Date.now(); m.players.forEach(function(p){ if(p.i===myIdx) return; var r=RIV.filter(function(x){ return x.idx===p.i; })[0]; if(!r){ r=runner(p.n,COLS[(p.i%4)||1]); r.idx=p.i; r.remote=1; RIV.push(r); } if(p.pos){ r.buf.push({t:m.now-Math.max(0,p.age),d:p.pos.d||0,y:p.pos.y||GY,st:p.pos.st||0}); } if(p.finishMs) r.fin=p.finishMs; }); if(m.result) showResult(m.result); }
    else if(m.t==="pos"){ var r=RIV.filter(function(x){ return x.idx===m.i; })[0]; if(r){ r.buf.push({t:m.at,d:m.p.d||0,y:m.p.y||GY,st:m.p.st||0}); if(r.buf.length>40) r.buf.splice(0,20); } }
    else if(m.t==="fx"&&m.to===myIdx&&m.k==="blast"){ var from=RIV.filter(function(x){ return x.idx===m.i; })[0]; stumble(ME,"🍔 Burger Blast from "+(from?from.n:"a rival")+"!"); }
    else if(m.t==="react"){ floatE(m.e); }
    else if(m.t==="result") showResult(m.result); };
  ws.onclose=function(){ if(!result&&S.mode==="race") setTimeout(function(){ if(!result) connect(); },1500); };
}
function remotePos(r,t){ var b=r.buf; if(!b.length) return; var a=b[0], c=b[b.length-1]; for(var i=b.length-1;i>0;i--) if(b[i-1].t<=t){ a=b[i-1]; c=b[i]; break; } var k=c.t>a.t?Math.max(0,Math.min(1.3,(t-a.t)/(c.t-a.t))):1; r.d=a.d+(c.d-a.d)*k; r.y=a.y+(c.y-a.y)*k; r.slide=c.st===2?.1:0; r.fall=c.st===3?.1:0; r.stun=c.st===4?.1:0; r.v=Math.max(0,(c.d-a.d)/Math.max(.05,(c.t-a.t)/1000)); r.anim+=.016*(r.v/VBASE); }

/* ---- drawing ---- */
function drawBg(cam){
  var g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#1b2440"); g.addColorStop(1,"#0e1426"); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // tiled kitchen wall (parallax .3)
  var p=cam*.3; cx.fillStyle="#232f52"; for(var y=40;y<GY-40;y+=22){ var o=((y/22)%2)*20; for(var x=-((p+o)%40)-40;x<W;x+=40){ cx.fillRect(x+1,y+1,38,20); } }
  // shelves with pans + the venue's own menu photos + banners (parallax .5)
  var p2=cam*.5;
  for(var s=Math.floor(p2/520)-1;s<Math.floor(p2/520)+3;s++){ var sx=s*520-p2;
    cx.fillStyle="#3a2a1e"; cx.fillRect(sx+40,120,220,10);
    var d=IM["deco"+(((s%4)+4)%4)]; if(ok(d)) cx.drawImage(d,sx+60,62,58,58); if(ok(d)) cx.drawImage(IM["deco"+((((s+1)%4)+4)%4)]||d,sx+150,66,52,52);

  cx.fillStyle="#141824"; cx.fillRect(0,GY+14,W,H-GY-14);
  // dish pits

    cx.fillStyle="#9aa3b5"; cx.font="800 10px Barlow,system-ui"; cx.textAlign="center"; cx.fillText("DISH PIT",(lx+rx)/2,GY+20); });

var CAM=0; function camX(){ return CAM-PX; }
function drawObs(){
  var t=(now()-startAt)/1000, cam=camX();
  C.obs.forEach(function(o){ var x=(o.k==="meatball"?o.x-t*90:o.x)-cam; if(x<-80||x>W+80) return;

    else if(o.k==="meatball"){ var rr=20, a=-t*4; cx.save(); cx.translate(x+20,GY-rr); cx.rotate(a); var g=cx.createRadialGradient(-6,-6,4,0,0,rr); g.addColorStop(0,"#a2552e"); g.addColorStop(1,"#5a2a14"); cx.fillStyle=g; cx.beginPath(); cx.arc(0,0,rr,0,6.283); cx.fill(); cx.fillStyle="#3c7a2a"; cx.fillRect(-3,-rr+2,6,4); cx.restore(); cx.fillStyle="rgba(200,40,20,.6)"; cx.fillRect(x+40,GY-3,30,3); }
    else if(o.k==="skillets"){ cx.strokeStyle="#9aa3b5"; cx.lineWidth=2; cx.beginPath(); cx.moveTo(x+28,0); cx.lineTo(x+28,GY-80); cx.stroke(); cx.fillStyle="#2b2b2b"; cx.beginPath(); cx.ellipse(x+28,GY-56,30,22,0,0,6.283); cx.fill(); cx.fillStyle="#444"; cx.fillRect(x+24,GY-104,8,26); cx.fillStyle="#ff5a3c"; cx.font="900 10px Barlow,system-ui"; cx.textAlign="center"; cx.fillText("SLIDE ↓",x+28,GY-18); }

function drawRunner(r,ghost){

    cx.strokeStyle="#1d1d1d"; cx.lineWidth=6; cx.lineCap="round"; cx.beginPath(); cx.moveTo(x-3,y-16); cx.lineTo(x-3+legs,y-1); cx.moveTo(x+3,y-16); cx.lineTo(x+3-legs,y-1); cx.stroke();
    cx.fillStyle=r.col; cx.beginPath(); cx.moveTo(x-12,y-16); cx.lineTo(x+12,y-16); cx.lineTo(x+10,y-38); cx.lineTo(x-10,y-38); cx.closePath(); cx.fill();
    cx.fillStyle="#fff"; cx.fillRect(x-9,y-34,18,4);
    cx.strokeStyle=r.col; cx.lineWidth=5; cx.beginPath(); cx.moveTo(x+8,y-34); cx.lineTo(x+16+legs*.5,y-24); cx.moveTo(x-8,y-34); cx.lineTo(x-16-legs*.5,y-24); cx.stroke();
    cx.fillStyle="#f4d3b0"; cx.beginPath(); cx.arc(x,y-45,8,0,6.283); cx.fill();
    cx.fillStyle="#fff"; cx.beginPath(); cx.arc(x-5,y-56,6,0,6.283); cx.arc(x,y-59,7,0,6.283); cx.arc(x+5,y-56,6,0,6.283); cx.fill(); cx.fillRect(x-7,y-55,14,5);
  }

  var tag=r===ME?"You":r.n; cx.font="800 11px Barlow,system-ui"; cx.textAlign="center"; var tw=cx.measureText(tag).width+12; cx.fillStyle=r===ME?"rgba(240,211,117,.92)":"rgba(10,14,26,.8)"; cx.beginPath(); cx.roundRect?cx.roundRect(x-tw/2,y-(sl?50:86),tw,16,8):cx.rect(x-tw/2,y-(sl?50:86),tw,16); cx.fill(); cx.fillStyle=r===ME?"#1a1405":"#fff"; cx.fillText(tag,x,y-(sl?38:74));

function drawHud(){

var TOAST=null; function toast(s){ TOAST={s:s,t:2}; }

/* ---- loop ---- */
function frame(ts){
  raf=requestAnimationFrame(frame);
  var dt=Math.min(.05,Math.max(0,(ts-(last||ts))/1000)); last=ts;
  if(S.running){
    if(AUTO) botThink(ME);

    RIV.forEach(function(r){ if(r.remote) remotePos(r,now()-140); else { botThink(r); step(r,dt); } });

}
