<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../../js/frame-guard.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Venue Versus · Table QR</title>
<!-- SousShift AI — Venue Versus printable table cards (opened from admin.html). Four cards per Letter page; each QR is a signed check-in
     link that only works through the date printed on it. Footer: "Powered by SousShift AI" (house rule for every client QR piece). -->
<script src="venues.js?v=vv1"></script>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}body{margin:0;font-family:Barlow,system-ui,sans-serif;background:#eee;color:#111}
.bar{padding:12px 16px;display:flex;gap:10px;align-items:center;background:#0b1220;color:#fff}.bar button{border:0;border-radius:10px;padding:10px 16px;font:800 15px system-ui;background:#d4af37;cursor:pointer}
.sheet{width:8.5in;max-width:100%;margin:16px auto;display:grid;grid-template-columns:1fr 1fr;gap:.25in;padding:.25in;background:#fff}
.c{border:2px dashed #bbb;border-radius:14px;padding:.25in;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:4.6in;justify-content:center}
.c .band{background:#0b1220;border-radius:10px;padding:8px 14px;width:100%;display:flex;justify-content:center}.c img.logo{max-height:.75in;max-width:2.6in}.c h2{margin:0;font:900 26px Georgia,serif}.c .k{font:800 11px system-ui;letter-spacing:.2em;text-transform:uppercase;color:#77242e}
.qr{width:2.1in;height:2.1in}.qr svg{width:100%;height:100%}.c p{margin:0;font-size:13px;line-height:1.35}.pw{font-size:9px;color:#666;margin-top:6px}
@media print{.bar{display:none}body{background:#fff}.sheet{margin:0;width:auto}}
</style>
</head>
<body>
<div class="bar"><button type="button" onclick="print()">🖨️ Print</button><span id="note"></span></div>
<div class="sheet" id="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search), h=new URLSearchParams(location.hash.slice(1)), SLUG=(q.get("slug")||"melody").replace(/[^a-z0-9-]/g,""), V=(window.VERSUS_VENUES||{})[SLUG]||{name:SLUG};
  var url=h.get("u")||"", until=+h.get("until")||0;
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  if(!/^https:\/\//.test(url)&&!/^http:\/\/(localhost|127\.0\.0\.1)/.test(url)){ document.getElementById("sheet").innerHTML="<p>Open this from the Venue Versus owner page.</p>"; return; }
  var d=until?new Date(until-4*3600000).toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"}):"";
  document.getElementById("note").textContent="Good through "+d;
  var svg=""; try{ var qq=qrcode(0,"M"); qq.addData(url); qq.make(); svg=qq.createSvgTag({cellSize:4,margin:0,scalable:true}); }catch(e){ svg=""; }
  var card='<div class="c">'+(V.logo?'<div class="band"><img class="logo" src="'+esc(V.logo)+'" alt="'+esc(V.name)+'"></div>':'')+'<div class="k">Venue Versus</div><h2>Play everyone at the bar</h2><div class="qr">'+svg+'</div>'+
    '<p><b>Scan to join tonight\'s battles</b> · free to play<br>Nightly high-score battle, quick battles, "Who wins?" picks</p><p style="font-size:11px;color:#555">Good through '+esc(d)+' · prizes are menu perks for Rewards members · drink perks 21+ with ID</p><div class="pw">Powered by SousShift AI</div></div>';
  document.getElementById("sheet").innerHTML=card+card+card+card;
})();
</script>
</body>
</html>
