<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melody Print Kit</title><meta name="robots" content="noindex">
<style>:root{--bg:#2a0610;--card:#3b0a16;--ink:#faf0dc;--gold:#e6c25a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:24px 16px}
main{max-width:860px;margin:auto}h1{font-size:28px;margin:0 0 4px}p{color:#e7d7b8}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.c{background:var(--card);border:1px solid #6b1a2a;border-radius:14px;padding:14px}.c img{width:100%;border-radius:10px;background:#ddd}.c h2{font-size:17px;margin:10px 0 4px}
a.b{display:inline-block;margin:6px 6px 0 0;padding:8px 12px;border-radius:999px;background:var(--gold);color:#2a0610;font-weight:700;text-decoration:none;font-size:14px}</style></head>
<body><main><h1>Melody Bar &amp; Grill · Print Kit</h1><p>Scan-tested QR codes that open the Melody app. Print the PDFs (they're print size). Every code goes to the same app.</p>
<div class="g">
<div class="c"><img src="poster_thumb.jpg" alt="Window poster"><h2>Window poster · 24×36 in</h2><a class="b" href="Melody_Window_Poster_24x36.pdf">PDF</a><a class="b" href="Melody_Window_Poster_24x36.jpg">JPG</a></div>
<div class="c"><img src="Melody_QR_Sticker_Square.png" alt="Square sticker"><h2>Square sticker · 3×3 in</h2><a class="b" href="Melody_QR_Sticker_Square.pdf">PDF</a><a class="b" href="Melody_QR_Sticker_Square.png">PNG</a></div>
<div class="c"><img src="Melody_QR_Sticker_Round.png" alt="Round sticker"><h2>Round sticker · 3 in</h2><a class="b" href="Melody_QR_Sticker_Round.pdf">PDF</a><a class="b" href="Melody_QR_Sticker_Round.png">PNG</a></div>
<div class="c"><img src="Melody_QR_Logo_Only.png" alt="Logo QR"><h2>QR code only · menus, receipts, napkins</h2><a class="b" href="Melody_QR_Logo_Only.png">PNG</a></div>
</div><div id="printspots"></div><script src="../../assets/printspots.js"></script></main></body></html>
