<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Melody Owner Setup</title><meta name="robots" content="noindex">
<style>
:root{--bg:#120a10;--card:#1e1018;--edge:#3a1c28;--ink:#fbf1de;--dim:#c9b8a6;--gold:#e6c25a;--red:#b3263a;--ok:#3ddc97}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif}
main{max-width:640px;margin:auto;padding:16px 16px 120px}
h1{font-size:26px;margin:6px 0 2px}h2{font-size:19px;margin:26px 0 8px;color:var(--gold)}
.sub{color:var(--dim);font-size:14px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.q{font-weight:700;font-size:15px}.hint{color:var(--dim);font-size:12.5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--edge);background:#2a1520;color:var(--ink);padding:8px 11px;border-radius:999px;font:600 14px system-ui;cursor:pointer}
.chip.on{background:var(--gold);color:#2a0610;border-color:var(--gold)}
.tg{flex:none;width:58px;height:32px;border-radius:999px;background:#4a2a35;position:relative;border:0;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--ok)}.tg.on::after{left:29px}
.price{display:flex;align-items:center;gap:6px;margin-top:8px}
.price button{width:38px;height:34px;border-radius:9px;border:1px solid var(--edge);background:#2a1520;color:var(--ink);font-size:20px}
.price b{min-width:74px;text-align:center;font-size:17px}.price{flex-wrap:wrap}.price .chip{width:auto;height:auto;font-size:13px;margin-left:4px}
.off{opacity:.45}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(18,10,16,.96);border-top:1px solid var(--edge);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar button{width:100%;max-width:640px;display:block;margin:auto;padding:15px;border:0;border-radius:12px;background:var(--gold);color:#2a0610;font:800 17px system-ui}
.note{background:#2b1a0a;border:1px solid #6b4b14;border-radius:12px;padding:10px;font-size:13.5px;color:#f3dfb5}
.prog{color:var(--dim);font-size:13px;text-align:center;margin-top:6px}
</style></head><body><main>
<h1>Melody · App Setup</h1>
<p class="sub">Hi Christian! Everything is filled in with what's in Melody's app now. Just tap to change anything. No typing. When you're done, hit <b>Send to Antidote</b> at the bottom.</p>
<p class="note">Your taps save on this phone, so you can stop and come back anytime.</p>
<div id="app"></div>
<p class="prog" id="saved"></p>
</main>
<div class="bar"><button id="send">✅ Send to Antidote</button></div>

var Q=[
 ["Weekly giveaway (gets people in the door)",[
  ["gw","Weekly giveaway prize",["No giveaway","$50","$100","$200","$250","$500"],3],
  ["gwtype","Prize is paid as",["Melody gift card","Food & drink credit","Cash"],0],
  ["gwearn","How guests earn entries",["1 per visit","1 per visit + 1 per game played","1 per visit + 1 per $25 spent","All of these + 3 for referring a friend"],3],

  ["gwtext","Text signed-up guests about it (\"You could win $200 this week…\")",["Yes, Monday + day of drawing","Yes, day of drawing only","No texts"],0],

 ["Deals & rewards",[

  ["refer","Reward for inviting a friend",["+50 pts when they join, +100 when they visit","+100 / +200 pts","No referral reward"],0],
  ["ppd","Points earned per $1 spent",["5 pts","10 pts","20 pts"],1],
  ["t1","Reward at 250 points",["Free Melody Fries","Free Gilroy Garlic Fries","$5 off"],0],
  ["t2","Reward at 500 points",["Free appetizer","$10 off","Half off a cocktail"],0,"California rules don't allow free alcohol as a reward. Drink discounts are OK."],
  ["t3","Reward at 800 points",["Free Lobster Mac & Cheese","Free any Mac & Cheese","$15 off"],0],
  ["t4","Reward at 1,300 points",["Free appetizer platter","Free entrée","$25 off"],0],
  ["hh","Double points during happy hour (3–6 PM)?",["Yes","No"],0],
  ["lv1","Regular level (3 visits in a month)",["5% off one item","10% off one item","15% off one item"],1],
  ["lv2","VIP level (6 visits in a month)",["15% off the order","20% off the order","25% off the order"],1],

  ["bday","Birthday treat (checked with ID)",["Free dessert","Free appetizer","Free entrée up to $20","20% off the order"],1],
  ["bdaywin","Birthday treat good for",["The birthday only","Birthday week","Birthday month"],1],

  ["winback","\"We miss you\" text after 30 days away",["Free Melody Fries","10% off","$5 off","Don't send"],0]]],
 ["Flight game prizes",[
  ["g1","Score 3,400",["$3 off any drink","Free Melody Fries","$5 off"],0],
  ["g2","Score 4,700",["Free Melody Fries","Free Gilroy Garlic Fries","$5 off"],0],

  ["g4","Score 6,400",["Free appetizer","Free Mac & Cheese","$15 off"],0],
  ["champ","Weekly #1 on the leaderboard",["Half off their meal","Free entrée","$25 off"],0]]],
 ["\"Just Landed\" LAX deal (boarding pass, last 24 hrs)",[

  ["jl3","Visitor to LA",["10% off one drink","15% off one drink"],0],
  ["crew","LAX crew 10% off with badge: show it in the app?",["Yes","No"],0]]],

 ["Weekly specials (from melodylax.com): still running?",[

 ["Questions callers ask the AI phone host",[

];
var K="melody-setup-v2", S={}; try{ S=JSON.parse(localStorage.getItem(K)||"{}"); }catch(e){}
function save(){ try{ localStorage.setItem(K,JSON.stringify(S)); }catch(e){} document.getElementById("saved").textContent="Saved on this phone ✓"; }
function h(t,c,x){ var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.innerHTML=x; return e; }
var app=document.getElementById("app");
Q.forEach(function(sec){
  app.appendChild(h("h2",null,sec[0]));
  sec[1].forEach(function(q){
    var c=h("div","card"); c.appendChild(h("div","q",q[1])); if(q[4]) c.appendChild(h("div","hint",q[4]));
    var ch=h("div","chips"), cur=S[q[0]]!=null?S[q[0]]:(q[3]>=0?q[2][q[3]]:null);
    q[2].concat(q[3]<0?["Not sure"]:[]).forEach(function(o){ var b=h("button","chip"+(o===cur?" on":""),o); b.type="button";
      b.onclick=function(){ S[q[0]]=o; [].forEach.call(ch.children,function(x){x.classList.remove("on");}); b.classList.add("on"); save(); }; ch.appendChild(b); });
    c.appendChild(ch); app.appendChild(c);
  });
});
function itemRow(key,name,price,web){
  var c=h("div","card"), st=S[key]||{on:true,p:price};
  var r=h("div","row"); r.appendChild(h("div","q",name)); var tg=h("button","tg"+(st.on?" on":"")); tg.type="button"; tg.setAttribute("aria-label","On the menu");
  r.appendChild(tg); c.appendChild(r);
  var p=h("div","price"), m=h("button",null,"−"), v=h("b"), pl=h("button",null,"+"); m.type=pl.type="button";
  function draw(){ v.textContent="$"+st.p.toFixed(2); c.classList.toggle("off",!st.on); tg.classList.toggle("on",st.on); }
  m.onclick=function(){ st.p=Math.max(0,Math.round((st.p-.25)*100)/100); S[key]=st; draw(); save(); };
  pl.onclick=function(){ st.p=Math.round((st.p+.25)*100)/100; S[key]=st; draw(); save(); };
  tg.onclick=function(){ st.on=!st.on; S[key]=st; draw(); save(); };
  p.appendChild(m); p.appendChild(v); p.appendChild(pl);
  if(web){ var w=h("button","chip","Website price $"+web.toFixed(2)); w.type="button"; w.onclick=function(){ st.p=web; S[key]=st; draw(); save(); }; p.appendChild(w); }
  c.appendChild(p); c.appendChild(h("div","hint","Tap the switch if it's not on the menu anymore. ± changes the price by 25¢.")); draw(); return c;
}


// giveaway potential: illustrative estimates, shown live under the prize choice
(function(){
  var E={"No giveaway":[0,0,0],"$50":[45,15,10],"$100":[95,30,22],"$200":[190,55,40],"$250":[230,65,48],"$500":[420,110,85]};
  var cards=app.querySelectorAll(".card"), c=cards[0], box=h("div","note"); box.style.marginTop="10px"; c.appendChild(box);
  function draw(){ var v=S.gw||"$200", e=E[v]||[0,0,0], amt=+(v.replace(/\D/g,""))||0;
    if(!amt){ box.innerHTML="No weekly giveaway. Rewards and the game still run."; return; }
    var rev=e[2]*35*4, cost=amt*4;
    box.innerHTML="<b>What a "+v+" weekly giveaway could do (estimate)</b><br>≈ "+e[0]+" entries a week · ≈ "+e[1]+" new sign-ups a week · ≈ "+e[2]+" extra return visits a week<br>"+
      "A month: you give away <b>$"+cost.toLocaleString()+"</b>, guests spend about <b>$"+rev.toLocaleString()+"</b> on those extra visits (at ~$35 a check)"+
      "<br><span style='opacity:.8'>Bigger prize = more people playing, signing up and coming back. These are estimates, not promises. Free entry with no purchase is always included (California law).</span>"; }
  [].forEach.call(c.querySelectorAll(".chip"),function(b){ b.addEventListener("click",function(){ setTimeout(draw,0); }); }); draw();
})();

last.appendChild(lc); app.appendChild(last);
function summary(){
  var out=["MELODY SETUP (from Christian)"];
  Q.forEach(function(sec){ out.push("\n"+sec[0].toUpperCase()); sec[1].forEach(function(q){ var v=S[q[0]]!=null?S[q[0]]:(q[3]>=0?q[2][q[3]]:"(no answer)"); out.push("• "+q[1]+": "+v); }); });
  var ch=[]; MENU.drinks.forEach(function(d){ var s=S["d:"+d[0]]; if(s&&(!s.on||s.p!==d[1])) ch.push("• "+d[0]+": "+(s.on?"$"+s.p.toFixed(2):"REMOVE")); });
  MENU.food.forEach(function(g){ g.items.forEach(function(i){ var s=S["f:"+i[0]]; if(s&&(!s.on||s.p!==i[1])) ch.push("• "+i[0]+": "+(s.on?"$"+s.p.toFixed(2):"REMOVE")); }); });
  out.push("\nMENU CHANGES"); out.push(ch.length?ch.join("\n"):"• No changes");
  out.push("\nGo live: "+(S.approved||"(no answer)"));
  return out.join("\n");
}
document.getElementById("send").onclick=function(){
  var t=summary();
  if(navigator.share){ navigator.share({title:"Melody setup",text:t}).catch(function(){}); }
  else { location.href="sms:&body="+encodeURIComponent(t); }
};
</script></body></html>
