name: Mirror Bangkok Landing app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Fetch app files from Netlify
        run: |
          set -e
          SRC="https://bangkok-landing-antidote.netlify.app"
          mkdir -p bangkok
          for f in index.html styles.css data.js places.js app.js docs.js thai.js scan.js map.js food.js errands.js money.js visatimer.js manifest.webmanifest sw.js icon-180.png icon-192.png icon-512.png; do
            curl -fsSL --retry 3 -o "bangkok/$f" "$SRC/$f"
            echo "got $f ($(wc -c < bangkok/$f) bytes)"
          done

      - name: Commit and push
        run: |
          git config user.name "bangkok-mirror[bot]"
          git config user.email "actions@github.com"
          git add bangkok/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Mirror Bangkok Landing app source from Netlify"
          git push origin HEAD:${{ github.ref_name }}
