<!doctype html><html><head><meta charset="utf-8">
<script src="../../../js/frame-guard.js"></script><title>Blimp Bench</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<style>body{margin:0;background:#7fa0c8}</style></head><body><script type="module">
import * as THREE from "three"; import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"; import { buildBlimp } from "../blimp.js";
const q = new URLSearchParams(location.search), r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x7fa0c8); s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), .04).texture;
s.add(new THREE.HemisphereLight(0xdfefff, 0x806040, 1.2)); const d = new THREE.DirectionalLight(0xfff0dd, 2.5); d.position.set(30, 60, 50); s.add(d);
const logo = await new Promise(res => new THREE.TextureLoader().load("../../nalu-vida/img/logo.png", t => { t.colorSpace = THREE.SRGBColorSpace; res(t); }, null, () => res(null)));
const b = buildBlimp(THREE, { top: "MELODY", logo }); s.add(b.node); b.update(+(q.get("t") || 1.2));
const c = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 2000), a = +(q.get("a") || .5), e = +(q.get("e") || -.1); c.position.set(Math.sin(a) * 220, Math.sin(e) * 220, Math.cos(a) * 220); c.lookAt(0, -4, 0); r.render(s, c);
</script></body></html>
