<title>SousShift AI — Demo Apps</title>
<link rel="canonical" href="https://antidotethecure.github.io/app/#apps">
<meta name="robots" content="noindex,follow">
<meta property="og:title" content="SousShift AI: your business, in your customers' pocket">

<meta property="og:image" content="https://antidotethecure.github.io/demo/storm-burger/img/classic.jpg">
<meta http-equiv="refresh" content="0; url=../../app/#apps">
<script>
/* /demo/setup/ moved into the SousShift app (/app/#apps). Keeps ?for= and truck links working. */
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  var who = q.get("for"), type = (q.get("type") || "").toLowerCase();
  if (who) out.set("for", who.slice(0, 60));
  var truck = /^(truck|trucks|icecream|ice-cream|foodtruck|food-truck)$/.test(type);
  if (truck) out.set("type", "truck");
  var h = location.hash;
  var hash = /^#(apps|trucks|ice-cream|food-truck)$/.test(h) ? h : (truck ? "#trucks" : "#apps");
  var s = out.toString();
  location.replace("../../app/" + (s ? "?" + s : "") + hash);
})();
</script>
