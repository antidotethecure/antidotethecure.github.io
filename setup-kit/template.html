      if(st.kind!=="pct") b.appendChild(h("span","pre","$")); b.appendChild(i); if(st.kind==="pct") b.appendChild(h("span","suf","%"));
      if(st.kind!=="price") amt.appendChild(b), amt.appendChild(h("span","unit","off")); else amt.appendChild(b);

    var dates=h("div","amt"), ds=dateBox(st.start,"Start date",function(v_){ st.start=v_; put(); drawW(); }), de=dateBox(st.end,"End date",function(v_){ st.end=v_; put(); drawW(); });

    tw.appendChild(chipRow(key+":text",YN,st.text,function(o){ st.text=o; if(o==="Yes"&&!st.send) st.send=st.start; put(); drawT(); })); tw.appendChild(sendRow);
    field("Text it to my customers?",tw,"Goes only to customers who tapped \"Text me deals\" when they signed up. Sent between 8 AM and 9 PM, and anyone can reply STOP. You approve it before it goes out. Part of the AI text agent add-on ($49/mo).");
    function drawT(){ sendRow.classList.toggle("hide",st.text!=="Yes"); }
    function drawW(){ when.textContent=st.start&&st.end?hFmt(st.start)+" – "+hFmt(st.end):"Pick your dates"; }
    function drawOn(){ tg.classList.toggle("on",!!st.on); body.classList.toggle("hide",!st.on); card.classList.toggle("off",false); }
    tg.onclick=function(){ st.on=!st.on; put(); drawOn(); };

  });
}

// your register (POS): which system + how to start, with a deep link to the step-by-step guide
var POSES=[["toast","Toast"],["square","Square"],["clover","Clover"],["spoton","SpotOn"],["lightspeed","Lightspeed"],["revel","Revel"],["other","Something else"],["none","No POS"]];

pq.appendChild(chipRow("pos",POSES.map(function(x){ return x[1]; }),posName(),function(o){ S.pos=POSES.filter(function(x){ return x[1]===o; })[0][0]; save(); posDraw(); }));

// menu: on/off + prices
function itemRow(key,name,price,web,mp){
  var c=h("div","card"), st=S[key]||{on:true,p:price};
  var r=h("div","row"); r.appendChild(h("div","q",name)); var tg=h("button","tg"+(st.on?" on":"")); tg.type="button"; tg.setAttribute("aria-label","On the menu");
  r.appendChild(tg); c.appendChild(r);
  function draw(){ if(v_) v_.textContent=money(st.p); c.classList.toggle("off",!st.on); tg.classList.toggle("on",st.on); }
  tg.onclick=function(){ st.on=!st.on; S[key]=st; draw(); save(); };
  var v_=null;
  if(typeof price==="number"){
    var p=h("div","price"), m=h("button",null,"−"), pl=h("button",null,"+"); v_=h("b"); m.type=pl.type="button"; m.setAttribute("aria-label","Lower price"); pl.setAttribute("aria-label","Raise price");
    m.onclick=function(){ st.p=Math.max(0,Math.round((st.p-.25)*100)/100); S[key]=st; draw(); save(); };
    pl.onclick=function(){ st.p=Math.round((st.p+.25)*100)/100; S[key]=st; draw(); save(); };
    p.appendChild(m); p.appendChild(v_); p.appendChild(pl);
    if(web){ var w=h("button","chip","Website price "+money(web)); w.type="button"; w.onclick=function(){ st.p=web; S[key]=st; draw(); save(); }; p.appendChild(w); }
    c.appendChild(p); c.appendChild(h("div","hint","Tap the switch if it's not on the menu anymore. ± changes the price by 25¢."));
  } else {

  }
  draw(); return c;
}
var M=CFG.menu;
function eachItem(fn){ M.drinks.forEach(function(g){ g.items.forEach(function(i){ fn("d:"+i[0],i,g); }); }); M.food.forEach(function(g){ g.items.forEach(function(i){ fn("f:"+i[0],i,g); }); }); }
if(CFG.menuNote) app.appendChild(h("p","note",CFG.menuNote));
if(M.drinks.length){
  app.appendChild(h("h2",null,CFG.drinksTitle||"Drinks in the app"));

}
M.food.forEach(function(g){ app.appendChild(h("h2",null,"Menu: "+g.name)); g.items.forEach(function(i){ app.appendChild(itemRow("f:"+i[0],i[0],i[1],i[2],i[3])); }); });

app.appendChild(h("h2",null,"Last thing"));
var last=h("div","card"); last.appendChild(h("div","q","Ready for Antidote to put these live?"));
last.appendChild(chipRow("approved",["Yes, put it live","Show me a preview first"],S.approved||null,function(o){ S.approved=o; save(); }));

window.SETUP_SUMMARY = function () { return summary(); };   // lets the owner's launch checklist (/launch/…) collect these answers
function summary(){
  var out=[CFG.name.toUpperCase()+" SETUP (from "+(OWNER==="there"?"the owner":OWNER)+")"];
  Q.forEach(function(sec){ out.push("\n"+sec[0].toUpperCase()); sec[1].forEach(function(q){
    if(q[4]&&!q[4](S)){ out.push("• "+lab(q)+": "+(q[4]===oneBal&&wOn()?"(using bar + kitchen points instead)":"(skipped)")); return; }
    var x=v(q[0]); out.push("• "+lab(q)+": "+(x==null?"(no answer)":x)); });
    if(sec===Q[0]) out.push("• Free entry with no purchase: included (California law)"); });
  var dOdds=drawOdds(); out.push("\nDAILY LUCKY DRAW (MEMBERS)"); out.push("• How often someone wins: "+dOdds);
  if(dOdds!=="Off"){ var dpz=drawPrizes(); out.push("• Prizes: "+(dpz.length?dpz.join(", "):"(none picked)")); out.push("• Winners redeem within: 3 days"); }
  out.push("\nPROMO CODES"); CODES.forEach(function(c){ var st=codeState(c); out.push("• "+codeName(c,st.v)+" – "+c[2]+": "+(st.on?"ON, "+st.v:"OFF")); });
  out=out.concat(holSummary());
  var ch=[]; eachItem(function(key,i){ var s=S[key]; if(s&&(!s.on||(typeof i[1]==="number"&&s.p!==i[1]))) ch.push("• "+i[0]+": "+(s.on?(typeof i[1]==="number"?money(s.p):"keep"):"REMOVE")); });
  out.push("\nYOUR REGISTER (POS)"); out.push("• What you ring up on: "+(posName()||"(no answer)")); out.push("• How you want to start: "+(S.posStart||"(no answer)"));
  out.push("\nMENU CHANGES"); out.push(ch.length?ch.join("\n"):"• No changes");
  if(window.IMPACT_SUMMARY) out.push("\n"+window.IMPACT_SUMMARY());
  out.push("\nGo live: "+(S.approved||"(no answer)"));
  return out.join("\n");
}
window.__setupSummary=summary;
$("send").onclick=function(){
  var t=summary();
  if(navigator.share){ navigator.share({title:SHORT+" setup",text:t}).catch(function(){}); }
  else { location.href="sms:&body="+encodeURIComponent(t); }
};
})();

<script>
/* "What the app does for you" — owner-facing impact estimate. Every number is a slider the owner can move.
   Model (kept conservative on purpose):
   - guests/month = busy-night crowd × busy nights + everyday guests × other open days
   - new members/month = guests × join rate × 70% (30% are repeat guests already on the list)
   - extra visits/month = members who joined in the LAST 3 MONTHS × come-back rate (older members aren't counted)
   - extra sales = extra visits × average spend · one text blast = list × 5% who show up × average spend */
(function(){
"use strict";
var C=window.CFG||{}, I=C.impact; var box=document.getElementById("impact"); if(!I||!box) return;
var SHORT=C.short||C.name, OWNER=C.owner&&C.owner!=="there"?C.owner:"";
var K=(C.storageKey||C.slug)+"-impact";
var D={crowd:I.crowd||150,nights:I.nights||4,daily:I.daily||80,days:I.days||22,join:I.join||25,back:I.back||20,spend:C.avgCheck||25,fee:I.fee||300};
var S={}; try{ S=JSON.parse(localStorage.getItem(K)||"{}")||{}; }catch(e){}
function val(k){ return S[k]!=null?S[k]:D[k]; }
function h(t,c,x){ var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; }
function n(x){ return Math.round(x).toLocaleString("en-US"); }
function usd(x){ return "$"+n(x); }
var F=[
 ["crowd","Guests on a busy night (inside + patio)",20,800,10,"",""],
 ["nights","Busy nights a month",0,16,1,"",""],
 ["daily","Guests on a regular day",0,600,10,"",""],
 ["days","Other days open a month",0,30,1,"",""],
 ["join","Guests who scan the table QR and join",5,60,1,"","%"],
 ["back","Members who come back one extra time a month",5,50,1,"","%"],
 ["spend","Average spend per guest",5,150,1,"$",""],
 ["fee","Your monthly plan",0,1000,25,"$",""]];
box.appendChild(h("h2",null,"📈 What the app does for "+SHORT));
var intro=h("p","sub"); intro.innerHTML=(OWNER?OWNER+", right":"Right")+" now every guest walks out and there's no way to bring them back. The app turns each one who scans into <b>your</b> customer: on your list, earning points, getting your texts. Move the sliders to match "+SHORT+"; the numbers update live.";
box.appendChild(intro);
var card=h("div","card"); box.appendChild(card);
var inWrap=h("div","imp-in"); card.appendChild(inWrap);
var lbl={};
F.forEach(function(f){ var w=h("div","imp-f"), l=h("label"), t=h("span",null,f[1]), b=h("b"); l.appendChild(t); l.appendChild(b); w.appendChild(l);
  var r=document.createElement("input"); r.type="range"; r.min=f[2]; r.max=f[3]; r.step=f[4]; r.value=val(f[0]); r.setAttribute("aria-label",f[1]);
  r.oninput=function(){ S[f[0]]=+r.value; try{ localStorage.setItem(K,JSON.stringify(S)); }catch(e){} draw(); };
  w.appendChild(r); if(f[0]==="fee"&&I.feeNote) w.appendChild(h("div","hint",I.feeNote)); inWrap.appendChild(w); lbl[f[0]]={b:b,f:f}; });
var be=h("div","imp-be"); card.appendChild(be);
var out=h("div","imp-out"); card.appendChild(out);
var chartT=h("div","q"); chartT.style.marginTop="14px"; chartT.textContent="Extra sales each month, first year"; card.appendChild(chartT);
var bars=h("div","imp-bars"), axis=h("div","imp-axis"); card.appendChild(bars); card.appendChild(axis);
var lg=h("div","imp-lg"); card.appendChild(lg);
var blast=h("div","note imp-blast"); card.appendChild(blast);
var safe=h("div","note imp-safe"); card.appendChild(safe);
card.appendChild(h("p","hint","Estimates, not a promise. They only count guests who come back because of the app (texts, points, prizes, the game), and only from people who joined in the last 3 months. Real results show up in your owner view as people join."));
function stat(big,v,s){ var e=h("div","imp-s"+(big?" big":"")); e.appendChild(h("b",null,v)); e.appendChild(h("span",null,s)); out.appendChild(e); }
function draw(){
  F.forEach(function(f){ var x=val(f[0]); lbl[f[0]].b.textContent=f[5]+n(x)+f[6]; });
  var guests=val("crowd")*val("nights")+val("daily")*val("days");
  var newM=guests*val("join")/100*0.7, back=val("back")/100, spend=val("spend"), fee=val("fee");
  var months=[], list=0; for(var m=1;m<=12;m++){ list+=newM; var recent=Math.min(m,3)*newM; months.push({list:list,visits:recent*back,sales:recent*back*spend}); }
  var m1=months[0], m3=months[2], yr=months.reduce(function(a,x){ return a+x.sales; },0);
  out.innerHTML="";
  stat(true,usd(m3.sales)+"/mo","extra sales once it's rolling (month 3 on) · "+(fee?(m3.sales/fee).toFixed(1)+"× your "+usd(fee)+" plan":"")+"");
  stat(false,n(newM),"new members on your list every month");
  stat(false,n(m3.visits),"extra visits a month (month 3 on)");
  stat(false,usd(m1.sales),"extra sales in month 1");
  stat(false,usd(yr),"extra sales in the first year");
  stat(false,n(months[5].list),"people you can text by month 6");
  stat(false,n(months[11].list),"people you can text by month 12");
  var mx=Math.max.apply(null,months.map(function(x){ return x.sales; }).concat([fee]))||1;
  bars.innerHTML=""; axis.innerHTML="";
  months.forEach(function(x,i){ var b=h("i"); b.style.height=(x.sales/mx*100)+"%"; b.title="Month "+(i+1)+": "+usd(x.sales); bars.appendChild(b); axis.appendChild(h("span",null,String(i+1))); });
  var fp=Math.max(1.5,fee/mx*100); bars.style.backgroundImage="linear-gradient(to top,transparent calc("+fp+"% - 2px),#e3262f calc("+fp+"% - 2px),#e3262f "+fp+"%,transparent "+fp+"%)";
  lg.textContent="Bars = extra sales per month · red line = what you pay ("+usd(fee)+"/mo)";
  var need=spend?Math.ceil(fee/spend):0, wk=need/4.33, setup=I.setup||0;
  var cum=0, pay=0; for(var q=0;q<12;q++){ cum+=months[q].sales-fee; if(!pay&&setup&&cum>=setup) pay=q+1; }
  be.innerHTML="<b class='n'>Break-even: "+n(need)+" extra visits a month</b><p>At "+usd(spend)+" a visit, the app pays for its "+usd(fee)+"/mo with just <b>"+n(need)+" guests a month who come back because of it, about "+(wk<1.5?"1":n(wk))+" a week</b>."+(guests?" That's "+(need/guests*100<1?"under 1":(need/guests*100).toFixed(1))+"% of the ~"+n(guests)+" guests you already serve each month.":"")+" Everything past that is extra money in your pocket.</p>"+
    (setup?"<p>💵 Your one-time "+usd(setup)+" setup is earned back "+(pay?"in about <b>"+pay+" month"+(pay>1?"s":"")+"</b> at these numbers":"<b>after the first year</b> at these numbers, so try your real numbers")+". After that, the app keeps paying you every month.</p>":"");
  safe.innerHTML="<b>🛡️ Your safety net</b><ul><li><b>You'll see it, not take our word for it.</b> Every guest who joins, every return visit and every reward used shows up in your owner view.</li>"+
    (I.resultsCheck!==false?"<li><b>90-day results check.</b> If the app isn't bringing back at least "+n(I.resultsVisits||12)+" tracked return visits a month by day 90, you can stop the monthly plan with 30 days' notice.</li>":"")+
    "<li><b>Your customer list is yours.</b> Everyone who joins while you're on the plan is yours to keep, with a full export if you ever stop.</li><li><b>Keep doing what you do.</b> Great food and good service bring them in the first time; the app is what brings them back.</li></ul>";
  var L6=months[5].list, show=L6*0.05;
  blast.innerHTML="<b>📲 One text to your list</b><br>By month 6 you can text about <b>"+n(L6)+"</b> people straight to their phone"+(I.event?" (\""+I.event+"\")":"")+". If just 5% show up, that's <b>"+n(show)+" guests ≈ "+usd(show*spend)+"</b> from one message. No ad spend, no hoping they see the post.";
}
draw();
window.IMPACT_SUMMARY=function(){ var g=val("crowd")*val("nights")+val("daily")*val("days"), nm=g*val("join")/100*0.7, s=nm*3*val("back")/100*val("spend"); return "IMPACT ESTIMATE: ~"+n(nm)+" new members/mo · ~"+usd(s)+"/mo extra sales from month 3 · plan "+usd(val("fee"))+"/mo · break-even "+n(Math.ceil(val("fee")/val("spend")))+" extra visits/mo"; };
})();
</script></body></html>
