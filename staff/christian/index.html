     fetches any: only the public reward values (demo/christian-live.js) and the employee's own practice points + quiz,
     which stay on this phone (and are copied to the backend's StaffPractice / StaffTraining tabs once it's deployed).
     Pictures: real screenshots made with scripts/christian-staff-shots.cjs from the guest apps with a fake guest.
     📲 Deal texts (2026-10-19): the "Get today's deals by text" card sends the employee's OWN name, mobile, start times and

 // 3 check pass

  stp("1",{en:"<b>Today's date and the seconds ticking.</b> A wrong date or frozen clock = not valid.",es:"<b>La fecha de hoy y los segundos avanzando.</b> Fecha equivocada o reloj congelado = no válido."})+

 // 8 nearby alerts + location buddy bonus (only where the owner has it)
 var LB=R.locationBonus; if(LB) h+="<section class='tut' id='t-nearby'><h3>8 · "+L({en:"Nearby alerts + Location buddy bonus",es:"Alertas cercanas + bono Location buddy"})+"</h3>"+

 // 9 one code per visit, one prize per day

 var cid=(REST==="m"?"MLD":"NLV")+"-4K7Q2";

  "<div class='card' style='margin-top:10px'><b>🔎 "+L({en:"Look up a card",es:"Buscar una tarjeta"})+"</b><div class='name' style='margin-top:8px'><input id='lkIn' maxlength='12' autocapitalize='characters' autocomplete='off' placeholder='"+cid+"' value='"+esc(LK||"")+"'><button class='btn' id='lkGo'>"+L({en:"Look up",es:"Buscar"})+"</button></div><p class='note' id='lkOut' aria-live='polite' style='margin:8px 0 0'></p></div></section>";

  stp("1",{en:"<b>Check the pass code.</b> Look at the live pass on the guest's phone (moving clock + countdown). Not sure? Type the code in <b>Check a pass code</b> (step 9): it says Live, Already used or Expired.",es:"<b>Revisa el código del pase.</b> Mira el pase en vivo en el teléfono del cliente (reloj que avanza + cuenta regresiva). ¿Dudas? Escribe el código en <b>Revisar un código de pase</b> (paso 9): dice Vigente, Ya usado o Vencido."})+
